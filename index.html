<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fly-through</title>
<style>
  :root { color-scheme: dark; --fg:#f3efe8; --dim:#b9b3a8; --accent:#ffb454; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:#0b0b0c; color:var(--fg);
    font: 14px/1.4 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; overflow:hidden; }
  canvas { position:fixed; inset:0; width:100%; height:100%; display:block; touch-action:none; cursor:grab; }
  body.dragging canvas { cursor:grabbing; }

  #title { position:fixed; left:20px; top:18px; font-size:15px; letter-spacing:.04em; text-shadow:0 1px 12px #000a; pointer-events:none; }

  #loader { position:fixed; inset:0; display:grid; place-content:center; gap:14px; text-align:center;
    background:#0b0b0c; transition:opacity .8s ease, visibility .8s; z-index:10; }
  #loader.done { opacity:0; visibility:hidden; pointer-events:none; }
  #loader .track { width:min(280px,70vw); height:2px; background:#fff2; border-radius:2px; overflow:hidden; margin:0 auto; }
  #bar { height:100%; width:0; background:var(--fg); transition:width .2s; }
  #pct { color:var(--dim); font-variant-numeric:tabular-nums; letter-spacing:.08em; }

  #ui { position:fixed; left:50%; bottom:calc(20px + env(safe-area-inset-bottom)); transform:translateX(-50%);
    display:flex; align-items:center; gap:12px; padding:10px 14px; border-radius:999px;
    background:#141416cc; backdrop-filter:blur(14px); border:1px solid #ffffff1a; width:min(560px, calc(100vw - 24px)); }
  body:not(.has-path) #ui { display:none; }
  button { font:inherit; color:var(--fg); background:#ffffff14; border:1px solid #ffffff1f; border-radius:999px;
    padding:6px 14px; cursor:pointer; white-space:nowrap; }
  button:hover { background:#ffffff26; }
  #playBtn { width:38px; padding:6px 0; }
  #slider { flex:1; accent-color:var(--fg); min-width:60px; }

  #resetBtn { position:fixed; right:20px; top:56px; background:#141416cc; backdrop-filter:blur(14px); }
  #hint { position:fixed; right:20px; top:18px; color:var(--dim); font-size:12px; text-align:right; pointer-events:none; text-shadow:0 1px 10px #000a; }
  body[data-mode="free"] .tour-hint, body[data-mode="tour"] .free-hint { display:none; }

  #author { position:fixed; left:20px; top:52px; padding:12px 14px; border-radius:12px; background:#141416d9;
    border:1px solid #ffffff1a; backdrop-filter:blur(14px); font-size:12px; max-width:290px; }
  #author b { color:var(--accent); font-weight:600; }
  #author kbd { background:#ffffff1c; border-radius:4px; padding:1px 6px; font:inherit; font-family:ui-monospace,Consolas,monospace; }
  #author .row { display:flex; justify-content:space-between; gap:16px; margin-top:4px; color:var(--dim); }
  #author .head { display:flex; justify-content:space-between; gap:14px; margin-bottom:6px; }

  #flash { position:fixed; left:50%; top:20px; transform:translate(-50%,-8px); background:#141416ee; padding:8px 16px;
    border-radius:999px; border:1px solid #ffffff1f; opacity:0; transition:.25s; pointer-events:none; }
  #flash.show { opacity:1; transform:translate(-50%,0); }
</style>
</head>
<body data-mode="free">
  <div id="title"></div>
  <button id="resetBtn" title="Back to the start (R)">↺ Reset</button>
  <div id="hint">
    <span class="tour-hint">Scroll or swipe to move · drag to look around</span>
    <span class="free-hint">W A S D to move · Q / E down / up · drag to look · scroll = speed</span>
  </div>

  <div id="ui">
    <button id="playBtn" title="Play / pause">▶</button>
    <input id="slider" type="range" min="0" max="1000" value="0" aria-label="Position along the tour">
    <button id="modeBtn">Explore freely</button>
  </div>

  <div id="author" hidden>
    <div class="head"><b>Author mode</b><span><span id="count">0 points</span> · <span id="modeLabel">free fly</span></span></div>
    <div class="row"><span><kbd>Space</kbd> drop a point</span><span><kbd>⌫</kbd> undo · <kbd>⇧⌫</kbd> clear</span></div>
    <div class="row"><span><kbd>P</kbd> preview</span><span><kbd>T</kbd> fly / preview</span></div>
    <div class="row"><span><kbd>O</kbd> fix orientation</span><span><kbd>X</kbd> save path.json</span></div>
    <div class="row"><span><kbd>R</kbd> reset to start</span><span><kbd>G</kbd> ground lock</span></div>
  </div>

  <div id="flash"></div>

  <div id="loader"><div id="pct">0%</div><div class="track"><div id="bar"></div></div></div>

  <script type="importmap">
  { "imports": {
      "three": "./vendor/three.module.js",
      "three/addons/": "./vendor/addons/",
      "@sparkjsdev/spark": "./vendor/spark.module.js"
  } }
  </script>
  <script type="module" src="./main.js"></script>
</body>
</html>
